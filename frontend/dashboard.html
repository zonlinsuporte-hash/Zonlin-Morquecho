<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonlin CRM - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">🏢 ZONLIN CRM</div>
        <div class="user-info">
            <span id="usuarioNombre"></span>
            <button id="logoutBtn">Cerrar Sesión</button>
        </div>
    </div>

    <div class="container">
        <h1>Dashboard</h1>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Clientes</h3>
                <p class="number">0</p>
            </div>
            <div class="stat-card">
                <h3>Pagos Pendientes</h3>
                <p class="number">RD$0.00</p>
            </div>
            <div class="stat-card">
                <h3>Tickets Abiertos</h3>
                <p class="number">0</p>
            </div>
            <div class="stat-card">
                <h3>Ingresos Hoy</h3>
                <p class="number">RD$0.00</p>
            </div>
        </div>

        <div class="menu">
            <a href="#" class="btn-menu">👥 Clientes</a>
            <a href="#" class="btn-menu">💰 Pagos</a>
            <a href="#" class="btn-menu">🎫 Tickets</a>
            <a href="#" class="btn-menu">📊 Reportes</a>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
